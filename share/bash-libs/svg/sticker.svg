<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Sticker / band template — 85mm × 25mm (European business-card width).
  Top and bottom orange strips meet the QR's white quiet zone.
  All text lines (NAME, U4/U5, FPR, EMAIL) are centered.
  Placeholders (envsubst): ${NAME} ${U4} ${FPR_LINE1} ${FPR_LINE2} ${EMAIL} ${QR_HREF}
  ${QR_HREF} is a data: URI containing the keyserver URL QR code.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     version="1.1"
     width="85mm" height="25mm"
     viewBox="0 0 85 25">
  <defs>
    <style type="text/css"><![CDATA[
      .card    { fill: #ffefea; stroke: #90462f; stroke-width: 0.35; }
      .accent  { fill: #ff8012; }
      .name    { font: italic bold 4.4px 'DejaVu Sans', sans-serif; fill: #1a1838; text-anchor: middle; }
      .email   { font: italic bold 3.4px 'DejaVu Sans', sans-serif; fill: #ff8012; text-anchor: middle; }
      .ident   { font: 2.4px 'DejaVu Sans Mono', monospace; fill: #1a1838; text-anchor: middle; }
      .fpr     { font: bold 2.4px 'DejaVu Sans Mono', monospace; fill: #1a1838; letter-spacing: 0.2px; text-anchor: middle; }
    ]]></style>
  </defs>

  <!-- Card background + top/bottom orange strips -->
  <rect class="card"   x="0.5" y="0.5"  width="84" height="24"/>
  <rect class="accent" x="0.5" y="0.5"  width="84" height="1.6" opacity="0.85"/>
  <rect class="accent" x="0.5" y="22.9" width="84" height="1.6" opacity="0.85"/>

  <!-- QR (data URI) — 20.8 × 20.8 mm, white quiet zone touches both orange strips -->
  <image x="62.2" y="2.1" width="20.8" height="20.8" xlink:href="${QR_HREF}"/>

  <!-- Text block (left of the QR, centered in [0..62.2]) -->
  <text class="name"  x="31.1" y="6.5">${NAME}</text>
  <text class="ident" x="31.1" y="10.5">${U4}</text>
  <text class="fpr"   x="31.1" y="14.0">${FPR_LINE1}</text>
  <text class="fpr"   x="31.1" y="17.0">${FPR_LINE2}</text>
  <text class="email" x="31.1" y="21.5">${EMAIL}</text>
</svg>
