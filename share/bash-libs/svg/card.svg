<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Business card template — 89mm × 59mm (standard French business card).
  Placeholders (envsubst): ${NAME} ${SUBTITLE} ${U4} ${FPR_LINE1} ${FPR_LINE2} ${EMAIL}
  Colors aligned with the djis-emission theme (secondary #2c284b, primary #ff8012).
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     version="1.1"
     width="89mm" height="59mm"
     viewBox="0 0 89 59">
  <defs>
    <style type="text/css"><![CDATA[
      .bg     { fill: #2c284b; }
      .card   { fill: #ffefea; stroke: #90462f; stroke-width: 0.4; }
      .stroke { stroke: #90462f; stroke-width: 0.4; fill: none; }
      .primary { fill: #ff8012; }
      .white  { fill: #fafafa; }
      .ink    { fill: #1a1838; }
      .accent { fill: #5d4ce6; }
      .wordmark { font: italic 11px 'TeX Gyre Adventor', 'URW Gothic L', sans-serif; }
      .wordmark-small { font: 4px 'TeX Gyre Adventor', 'URW Gothic L', sans-serif; }
      .tagline { font: italic 3.2px 'TeX Gyre Adventor', sans-serif; }
      .name    { font: italic bold 5px 'DejaVu Sans', sans-serif; }
      .ident   { font: 2.8px 'DejaVu Sans Mono', monospace; }
      .fpr     { font: bold 2.8px 'DejaVu Sans Mono', monospace; letter-spacing: 0.25px; }
      .email   { font: italic bold 3.6px 'DejaVu Sans', sans-serif; fill: #ff8012; }
    ]]></style>
  </defs>

  <!-- Card outer frame -->
  <rect class="bg" x="0" y="0" width="89" height="59"/>

  <!-- Pug (djibian_logo_pug_only.svg, scaled to fit ~24mm tall in the top band) -->
  <g transform="translate(3,3) scale(0.085)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left eye (circle + Ɉ inside) -->
    <g transform="matrix(1.171,0,0,1.171,-22.43,-17.41)">
      <path d="M 95.80,105.29 c -8.24,-0.08 -14.69,-7.09 -14.55,-15.87 0.14,-8.70 6.88,-15.49 14.98,-15.26 7.74,0.23 14.26,6.87 14.26,15.64 0,8.93 -6.81,15.49 -14.69,15.49 z"
            fill="#000" stroke="#ff8012" stroke-width="0.17"/>
      <path d="m 96.25,73.45 c -8.51,-0.24 -15.57,6.90 -15.72,15.96 -0.15,9.13 6.61,16.52 15.26,16.60 8.28,0 15.41,-6.91 15.41,-16.20 0,-9.13 -6.82,-16.11 -14.96,-16.36 z m -0.04,1.43 c 7.34,0.22 13.57,6.50 13.57,14.92 0,8.56 -6.49,14.77 -13.97,14.77 -7.84,-0.07 -13.98,-6.72 -13.84,-15.14 0.14,-8.33 6.55,-14.77 14.24,-14.55 z"
            fill="#ff8012" stroke="#ff8012" stroke-width="0.17"/>
    </g>
    <text x="87.2" y="94.2" class="primary" style="font-family:'TeX Gyre Adventor',sans-serif;font-style:italic;font-size:24px;letter-spacing:-1.3px;">Ɉ</text>

    <!-- Right eye (circle + Ɉ inside) -->
    <g transform="matrix(1.171,0,0,1.171,51.76,-38.80)">
      <path d="M 95.80,105.29 c -8.24,-0.08 -14.69,-7.09 -14.55,-15.87 0.14,-8.70 6.88,-15.49 14.98,-15.26 7.74,0.23 14.26,6.87 14.26,15.64 0,8.93 -6.81,15.49 -14.69,15.49 z"
            fill="#000" stroke="#ff8012" stroke-width="0.17"/>
      <path d="m 96.25,73.45 c -8.51,-0.24 -15.57,6.90 -15.72,15.96 -0.15,9.13 6.61,16.52 15.26,16.60 8.28,0 15.41,-6.91 15.41,-16.20 0,-9.13 -6.82,-16.11 -14.96,-16.36 z m -0.04,1.43 c 7.34,0.22 13.57,6.50 13.57,14.92 0,8.56 -6.49,14.77 -13.97,14.77 -7.84,-0.07 -13.98,-6.72 -13.84,-15.14 0.14,-8.33 6.55,-14.77 14.24,-14.55 z"
            fill="#ff8012" stroke="#ff8012" stroke-width="0.17"/>
    </g>
    <text x="161.4" y="72.8" class="primary" style="font-family:'TeX Gyre Adventor',sans-serif;font-style:italic;font-size:24px;letter-spacing:-1.3px;">Ɉ</text>

    <!-- Eye whites highlights -->
    <ellipse transform="matrix(0.976,-0.217,0.264,0.964,0,0)" cx="101.04" cy="117.90" rx="9.09" ry="7.55" fill="#fff"/>

    <!-- Pug head + ears -->
    <path d="m 94.60,34.62 c -1.12,1.54 -2.18,2.83 -3.16,4.20 -6.51,9.01 -12.12,18.85 -16.30,29.91 -2.36,6.27 -4.20,12.82 -5.14,19.76 -0.83,6.15 -0.99,12.42 -0.13,18.73 0.38,2.67 0.61,5.42 0.48,8.06 -0.03,1.41 -0.20,2.73 -0.60,4.04 -0.87,2.62 -2.45,3.52 -4.81,2.81 -1.33,-0.41 -2.45,-1.16 -3.65,-2.01 -2.40,-1.87 -4.52,-4.17 -6.51,-6.72 C 48.68,105.55 43.79,96.77 40.47,86.82 39.17,82.88 38.24,78.95 38.17,74.79 c -0.10,-3.19 0.46,-6.17 1.99,-8.76 0.28,-0.43 0.41,-0.96 0.61,-1.39 1.37,-3.04 3.34,-5.43 5.46,-7.64 3.54,-3.65 7.62,-6.49 11.86,-8.97 7.04,-4.13 14.47,-7.18 22.15,-9.51 4.56,-1.40 9.14,-2.54 13.70,-3.85 0.22,-0.08 0.29,-0.08 0.66,-0.06 z"
          fill="#000" stroke="#888" stroke-width="1.8"/>
    <path d="m 135.21,23.40 c 0.72,-0.24 1.45,-0.56 2.17,-0.79 7.17,-2.35 14.49,-4.35 21.91,-5.63 6.84,-1.22 13.77,-1.81 20.81,-1.17 4.04,0.34 8.01,1.13 11.95,2.88 1.49,0.68 2.98,1.54 4.33,2.57 0.15,0.18 0.37,0.28 0.60,0.38 2.23,1.15 3.98,3.17 5.30,5.52 1.78,3.08 2.84,6.39 3.61,9.96 1.19,5.09 1.64,10.15 1.81,15.28 0.24,7.44 -0.26,14.75 -1.86,21.76 -0.45,2.01 -1.12,3.93 -1.86,5.76 -0.47,1.22 -1.17,2.34 -1.87,3.28 -1.69,2.14 -3.81,2.14 -5.78,0.11 -0.83,-0.92 -1.60,-1.92 -2.29,-3.01 -1.24,-2.00 -2.18,-4.16 -3.06,-6.40 -3.21,-8.71 -7.98,-16.07 -13.82,-22.50 -5.69,-6.25 -11.93,-11.37 -18.65,-15.80 -7.33,-4.81 -14.84,-8.75 -22.70,-11.82 -0.22,-0.10 -0.37,-0.19 -0.59,-0.29 z"
          fill="#000" stroke="#888" stroke-width="1.8"/>

    <!-- Pug muzzle / body -->
    <path d="m 184.37,113.89 c -0.71,-2.94 -1.58,-5.80 -2.46,-8.75 -0.59,-2.05 -1.52,-4.03 -2.77,-5.67 -1.71,-2.27 -3.74,-4.02 -5.84,-5.60 -0.97,-0.74 -1.93,-1.39 -2.89,-2.05 -0.87,-0.56 -1.75,-1.12 -2.62,-1.68 -0.26,-0.19 -0.52,-0.20 -0.78,-0.38 -1.83,-1.13 -3.74,-1.99 -5.65,-2.76 -3.38,-1.45 -6.92,-2.37 -10.44,-3.11 -1.03,-0.21 -1.98,-0.42 -3.00,-0.46 -1.80,-0.15 -3.59,-0.22 -5.39,-0.28 -0.43,-0.02 -0.69,-0.11 -1.04,-0.48 -1.59,-1.56 -3.35,-2.77 -5.39,-2.76 -0.26,-0.01 -0.52,-0.11 -0.77,-0.12 -2.57,-0.36 -5.05,-0.36 -7.50,0.35 -2.53,0.71 -4.87,2.04 -6.94,3.73 -0.50,0.42 -1.08,0.85 -1.57,1.27 -1.41,1.01 -2.21,2.40 -2.48,4.33 -0.06,0.71 -0.31,0.96 -0.80,1.30 -2.67,1.58 -5.16,3.53 -7.55,5.65 -3.63,3.32 -6.73,7.19 -9.47,11.51 -0.56,0.95 -1.13,1.82 -1.69,2.77 -0.40,0.78 -0.79,1.56 -1.19,2.34 -0.16,0.35 -0.31,0.78 -0.47,1.22 -0.70,1.74 -1.49,3.48 -2.10,5.32 -1.39,3.84 -1.41,7.91 -0.31,12.10 0.91,3.66 1.81,7.31 2.97,10.80 0.96,2.95 2.01,5.82 3.39,8.52 0.92,1.80 2.01,3.52 3.43,4.90 2.66,2.66 5.67,3.38 8.90,2.88 1.78,-0.29 3.47,-0.67 5.25,-0.96 1.10,-0.14 2.21,-0.19 3.33,-0.06 1.46,0.14 2.83,0.37 4.20,0.59 1.62,-0.12 3.15,-0.15 4.77,-0.27 3.23,-0.33 6.36,-1.10 9.39,-2.05 4.72,-1.51 9.45,-2.93 14.18,-4.09 3.64,-0.84 7.18,-1.87 10.54,-3.34 2.77,-1.14 5.36,-2.73 7.67,-4.77 0.83,-0.68 1.66,-1.36 2.58,-1.76 1.85,-0.73 3.70,-1.55 5.55,-2.28 1.85,-0.73 3.52,-1.82 4.82,-3.45 1.79,-2.32 2.36,-5.22 2.42,-8.31 -0.18,-4.78 -1.13,-9.50 -2.24,-14.13 z"
          fill="#000" stroke="#888" stroke-width="1.8"/>
  </g>

  <!-- foopgp.org wordmark, with Ɉ rotated 180° standing in for the "f" -->
  <g transform="translate(31,16)">
    <text class="wordmark white" x="0" y="0">
      <tspan transform="rotate(180,0,-3)" style="fill:#ff8012;">Ɉ</tspan><tspan>oopgp</tspan><tspan class="wordmark-small">.org</tspan>
    </text>
  </g>

  <!-- Subtitle / association tagline -->
  <text class="tagline white" x="31" y="22">${SUBTITLE}</text>

  <!-- vCard zone (lower half, cream background) -->
  <rect class="card" x="0.5" y="28" width="88" height="30.5"/>

  <text class="name ink"  x="4" y="36">${NAME}</text>
  <text class="ident ink" x="4" y="41.5">${U4}</text>
  <text class="fpr ink"   x="4" y="47">${FPR_LINE1}</text>
  <text class="fpr ink"   x="4" y="51.5">${FPR_LINE2}</text>
  <text class="email"     x="4" y="56.5">${EMAIL}</text>
</svg>
