<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Business card template — 89mm × 59mm.
  Style and colour scheme inspired by resources/svg/foopgp_card_fr.svg
  ("Friends of OpenPGP" / "Les amis d'OpenPGP").
  Placeholders (envsubst):
      ${SUBTITLE}                                  (i18n — see bl-pgpid)
      ${NAME} ${U4} ${FPR_LINE1} ${FPR_LINE2} ${EMAIL}
  Ident block (NAME / U4 / FPR / EMAIL) layout matches sticker.svg
  byte-for-byte (same fonts, sizes, alignments) — minus the QR.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     version="1.1"
     width="89mm" height="59mm"
     viewBox="0 0 89 59">
  <defs>
    <style type="text/css"><![CDATA[
      .bg       { fill: #2c284b; }
      .card     { fill: #ffefea; stroke: #90462f; stroke-width: 0.35; }
      .accent   { fill: #ff8012; }
      .subtitle { font: italic 6.5px 'DejaVu Sans', sans-serif; fill: #ffefea; text-anchor: middle; }
      .name     { font: italic bold 4.4px 'DejaVu Sans', sans-serif; fill: #1a1838; text-anchor: middle; }
      .email    { font: italic bold 3.4px 'DejaVu Sans', sans-serif; fill: #ff8012; text-anchor: middle; }
      .ident    { font: 2.4px 'DejaVu Sans Mono', monospace; fill: #1a1838; }
      .fpr      { font: bold 2.4px 'DejaVu Sans Mono', monospace; fill: #1a1838; letter-spacing: 0.2px; text-anchor: middle; }
    ]]></style>
  </defs>

  <!-- Top dark zone (≈ 30mm) — i18n subtitle as the foopgp brand statement -->
  <rect class="bg" x="0" y="0" width="89" height="30"/>
  <text class="subtitle" x="44.5" y="19">${SUBTITLE}</text>

  <!-- Bottom cream zone (≈ 29mm) — ident block, identical typography to sticker.svg -->
  <rect class="card" x="0.5" y="30.5" width="88" height="28"/>
  <rect class="accent" x="0.5" y="30.5" width="88" height="1.6" opacity="0.85"/>

  <!-- Ident block: sticker layout shifted by +32mm; FPR centered like email -->
  <text class="name"  x="44.5" y="38.5">${NAME}</text>
  <text class="ident" x="2.5"  y="42.5">${U4}</text>
  <text class="fpr"   x="44.5" y="46">${FPR_LINE1}</text>
  <text class="fpr"   x="44.5" y="49">${FPR_LINE2}</text>
  <text class="email" x="44.5" y="54.5">${EMAIL}</text>
</svg>
